name: quality

on:
  push:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, openssl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Format forms service
        run: |
          ./vendor/bin/pint app/Services/Forms/FormEngineService.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Forms/FormEngineService.php
          if ! git diff --cached --quiet; then
            git commit -m "Format forms workflow service [skip ci]"
            git push
          fi
